<div class="metric-card" [class.warning]="calculations.isWarning" [class.critical]="calculations.isCritical">
  <div class="metric-header">
    <h3 class="metric-title">{{ config.title }}</h3>
    <div class="metric-status" *ngIf="calculations.statusIcon">
      <mat-icon>{{ calculations.statusIcon }}</mat-icon>
    </div>
  </div>
  
  <div class="metric-value" [class.inverse]="config.inverse">
    {{ formattedValue }}<span class="metric-unit">{{ config.unit }}</span>
  </div>
  
  <div class="metric-indicator">
    <div class="indicator-track">
      <div 
        class="indicator-fill" 
        [style.width.%]="calculations.fillPercentage"
        [class.warning]="calculations.isWarning"
        [class.critical]="calculations.isCritical"
      ></div>
    </div>
    <div class="indicator-label">
      <span *ngIf="config.warningThreshold !== null || config.criticalThreshold !== null">
        {{ config.warningThreshold !== null ? config.warningThreshold : '-' }} / 
        {{ config.criticalThreshold !== null ? config.criticalThreshold : '-' }}{{ config.unit }}
      </span>
    </div>
  </div>
</div>
