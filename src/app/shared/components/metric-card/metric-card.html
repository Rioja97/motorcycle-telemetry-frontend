<mat-card class="metric-card">
  <mat-card-header>
    <div mat-card-avatar class="metric-icon">
      <mat-icon>{{icon}}</mat-icon>
    </div>
    <mat-card-title>{{label}}</mat-card-title>
    <mat-card-actions align="end">
      <div class="trend-indicator" [class]="trendClass">
        <mat-icon>{{trendIcon}}</mat-icon>
      </div>
    </mat-card-actions>
  </mat-card-header>
  <mat-card-content>
    <div class="metric-value">{{value}}</div>
  </mat-card-content>
  <mat-divider *ngIf="showProgress"></mat-divider>
  <mat-progress-bar *ngIf="showProgress" [value]="progressValue" class="metric-progress"></mat-progress-bar>
</mat-card>
